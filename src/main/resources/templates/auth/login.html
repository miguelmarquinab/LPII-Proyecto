<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Acceso | Sistema de Inventario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        body { min-height: 100vh; background: radial-gradient(1200px 600px at top right, #eef3ff, #ffffff); }
        .card { border: 0; border-radius: 1.25rem; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
        .brand { font-weight: 700; letter-spacing:.5px; }
        .btn-primary { border-radius: .75rem; padding: .7rem 1rem; }
        .form-control { border-radius: .75rem; padding:.7rem .9rem; }
        .muted { color:#6c757d; font-size:.9rem; }
    </style>
</head>
<body class="d-flex align-items-center">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-11 col-sm-9 col-md-7 col-lg-5">
            <div class="text-center mb-4">
                <div class="brand fs-4">Sistema de Inventario</div>
                <div class="muted">Ingresa tus credenciales</div>
            </div>

            <div class="card p-4 p-md-5">
                <form th:action="@{/login}" method="post">
                    <input type="hidden" th:if="${_csrf!=null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div class="mb-3">
                        <label class="form-label">Usuario</label>
                        <input class="form-control" name="username" autocomplete="username" required/>
                    </div>

                    <div class="mb-2">
                        <label class="form-label">Contraseña</label>
                        <input class="form-control" type="password" name="password" autocomplete="current-password" required/>
                    </div>

                    <div th:if="${param.error}" class="alert alert-danger mt-3">Credenciales inválidas.</div>
                    <div th:if="${param.logout}" class="alert alert-success mt-3">Sesión cerrada correctamente.</div>

                    <div class="d-grid mt-3">
                        <button class="btn btn-primary" type="submit">Ingresar</button>
                    </div>
                </form>
            </div>

            <p class="text-center mt-4 muted">© <span th:text="${#dates.format(#dates.createNow(),'yyyy')}"></span></p>
        </div>
    </div>
</div>
</body>
</html>
