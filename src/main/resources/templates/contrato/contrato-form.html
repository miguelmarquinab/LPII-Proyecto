
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Editar / Crear contrato</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>



     <div class="container">
        <div>
            <h1 th:text="${titulo}"></h1>
        </div>

        <div>
            <h3>Información General</h3>
            <form th:action="@{/contrato/guardar}" method="post" th:object="${contrato}">
                <div class="row mb-4">
                    <div class="col-md-6">
                    <input type="hidden" name="id" th:field="*{id}" />
                        <div class="mb-3">
                            <label for="numeroContrato" class="form-label required-field">N° Contrato</label>
                            <input type="text" class="form-control" id="numero" name="numero" th:field="*{numero}">
                        </div>
                        
                        <div class="mb-3">
                            <label for="fechaInicio" class="form-label required-field">Fecha Inicio</label>
                            <input type="date" class="form-control" id="fechaInicio" name="fechaInicio" required th:field="*{fechaInicio}">
                        </div>
                        
                        <div class="mb-3">
                            <label for="tipoContrato" class="form-label">Tipo de Contrato</label>
                            <select class="form-select" id="tipoContrato" name="tipoContrato"  th:field="*{tipoContrato}">
                                <option selected value="">Seleccione</option>
                                <option value="Mensual">Mensual</option>
                                <option value="Trimestral">Trimestral</option>
                                <option value="Semestral">Semestral</option>
                                <option value="Anual">Anual</option>

                            </select>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="idCliente" class="form-label required-field">Cliente</label>
                            <select class="form-select" id="cliente" name="cliente" required th:field="*{cliente.id}">
                            <option value="">Seleccione cliente</option>
                            <option th:each="cliente : ${clientes}"
                            th:value="${cliente.id}"
                            th:text="${cliente.razonSocial}">
                    </option>
                            </select>
                        </div>
                        
                        <div class="mb-3">
                            <label for="fechaFin" class="form-label required-field">Fecha Fin</label>
                            <input type="date" class="form-control" id="fechaFin" name="fechaFin" required th:field="*{fechaFin}">
                        </div>
                    </div>
                </div>
                
                <div class="mb-3">
                    <label for="observaciones" class="form-label">Observaciones</label>
                    <textarea class="form-control" id="observaciones" name="observaciones" rows="3" placeholder="Observaciones..." th:field="*{observaciones}">></textarea>
                </div>
        </div>

        <div class="form-card">
            <h3>Detalle de Equipos a Alquilar</h3>
            
            <div class="table-responsive">
                <table class="table table-striped table-bordered" id="equipmentTable">
                    <thead class="table-primary">
                        <tr>
                            <th>Modelo de Radio</th>
                            <th width="120">Cantidad</th>
                            <th width="150">Precio Unit.</th>
                            <th width="150">Subtotal</th>
                        </tr>
                    </thead>
                    <tbody>
                    <!--
.

                    <% for(Modelo m : listaModelos) { 
                    	 DetalleContrato detalleEncontrado = null;
                    	 
                    	 for(DetalleContrato d: listaDetalleContrato){
                    		 if (m.getModeloId() == d.getModeloId()){
                    			 detalleEncontrado = d;
                    			 break;
                    		 }
                    	 }
                    %>
                    
                        <tr>
                            <td>
                       			<%= m.getCodigo() +  " - " + m.getDescripcion() %>"
                       			<input type="hidden" name="idModelo" value="<%= m.getModeloId() %>">
                       			<input type="hidden" name="idDetalleContrato" value="<%= detalleEncontrado != null ? detalleEncontrado.getId() : 0 %>">
                            </td>
                            <td>
                                <input type="number" class="form-control form-control-sm" name="cantidad" value="<%= detalleEncontrado != null ? detalleEncontrado.getCantidad() : 0 %>" min="0">
                            </td>
                            <td>
                                <div class="input-group input-group-sm">
                                    <span class="input-group-text">S/</span>
                                    <input type="number" class="form-control" name="precioUnitario" value="<%= detalleEncontrado != null ? detalleEncontrado.getPrecioUnitario() : 0 %>" step="0.01" min="0">
                                </div>
                            </td>
                            <td>
                                <div class="input-group input-group-sm">
                                    <span class="input-group-text">S/</span>
                                    <input type="number" class="form-control" name="subtotal" value="<%= detalleEncontrado != null ? detalleEncontrado.getSubtotal() : 0 %>" step="0.01" readonly>
                                </div>
                            </td>
                        </tr>
                        <% } %>
                        -->
                    </tbody>
                </table>
            </div>
            
            <div>
                <h4 class="mb-0">TOTAL MENSUAL: S/ <input id="totalMensual" name="totalMensual" value="2250.00"></h4>
                
            </div>
        </div>
        
        <div class="d-flex justify-content-end gap-2 mt-4">
            <button type="button" class="btn btn-secondary" onclick="window.history.back()">Cancelar</button>
            <button type="submit" class="btn btn-primary">Guardar Contrato</button>
        </div>
        </form>
    </div>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
	<script type="text/javascript">
		document.addEventListener('input', function(e){
			if (e.target.name === 'cantidad' || e.target.name === 'precioUnitario') {
				const fila = e.target.closest('tr');
				const cantidad = fila.querySelector('input[name="cantidad"]').value;
				const precioUnitario = fila.querySelector('input[name="precioUnitario"]').value;
				const subTotal = cantidad * precioUnitario;
				fila.querySelector('input[name="subtotal"]').value = subTotal.toFixed(2);
				calcularTotal();
			}
		});
		
		function calcularTotal(){
			let total = 0;
			const subTotales = document.querySelectorAll('input[name="subtotal"]');
			subTotales.forEach(e => {
				total += parseFloat(e.value);
			})
			document.getElementById('totalMensual').value = total.toFixed(2);
		}
		
		window.onload = function() {
			calcularTotal();
	    };
	</script>
</body>


</html>
