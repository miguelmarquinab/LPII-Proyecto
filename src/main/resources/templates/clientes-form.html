<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Clientes</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
	    <div class="container">
        <div class="card shadow-sm">
            <div class="card-header" >
                <h1 class="card-title h4 mb-0" th:text="${titulo}"></h1>
            </div>
            <div class="card-body">
                <form id="formCliente" method="post" th:action="@{/cliente/registrar}" th:object="${cliente}">
                    <input type="hidden" name="clienteId" th:field="*{id}" />

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="codigo" class="form-label">Código</label>
                            <input type="text" class="form-control" id="codigo" name="codigo" required value="<%= cliente.getCodigo() %>">
                        </div>
                        <div class="col-md-6">
                            <label for="razonSocial" class="form-label">Razón Social</label>
                            <input type="text" class="form-control" id="razonSocial" name="razonSocial" required value="<%= cliente.getRazonSocial() %>">
                        </div>
                        <div class="col-md-6">
                            <label for="tipoDocumento" class="form-label">Tipo de Documento</label>
                            <select class="form-select" id="tipoDocumento" name="tipoDocumento" required>
								<option value="" disabled <%= !existeCliente ? "selected" : "" %>>Seleccione...</option>
                                <option value="DNI" <%= existeCliente && "DNI".equals(cliente.getTipoDocumento()) ? "selected" : "" %>>DNI</option>
                                <option value="RUC" <%= existeCliente && "RUC".equals(cliente.getTipoDocumento()) ? "selected" : "" %>>RUC</option>
                        
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="nroDocumento" class="form-label">Número de Documento</label>
                            <input type="text" class="form-control" id="nroDocumento" name="nroDocumento" required value="<%= cliente.getNumeroDocumento() %>">
                        </div>
                        <div class="col-12">
                            <label for="direccion" class="form-label">Dirección</label>
                            <input type="text" class="form-control" id="direccion" name="direccion" value="<%= cliente.getDireccion() %>">
                        </div>
                        <div class="col-md-6">
                            <label for="telefono" class="form-label">Teléfono</label>
                            <input type="tel" class="form-control" id="telefono" name="telefono" value="<%= cliente.getTelefono() %>">
                        </div>
                        <div class="col-md-6">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" name="email" value="<%= cliente.getEmail() %>">
                        </div>
                        <div class="col-12">
                            <label for="contacto" class="form-label">Contacto</label>
                            <input type="text" class="form-control" id="contacto" name="contacto" value="<%= cliente.getContacto() %>">
                        </div>
                        
                        <div class="col-md-6">
                            <label for="activo" class="form-label">Estado</label>
                            <select class="form-select" id="activo" name="activo" required>
                                <option value="true" <%= existeCliente && cliente.getActivo() ? "selected" : "" %>>Activo</option>
                                <option value="false" <%= existeCliente && !cliente.getActivo() ? "selected" : "" %>>Inactivo</option>
                            </select>
                        </div>
                        
                        <div class="col-12">
                            <button type="submit" class="btn btn-primary mt-3">Guardar</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
	<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
	<script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.min.js  " ></script>
</body>
</html>
