<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Dashboard | Sistema de Inventario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <style>
        body { min-height: 100vh; }
        .sidebar { width: 240px; background:#0d6efd; color:#fff; }
        .sidebar a { color:#fff; text-decoration:none; display:block; padding:.75rem 1rem; }
        .sidebar a:hover { background: rgba(255,255,255,.15); }
    </style>
</head>
<body>
<div class="d-flex">
    <aside class="sidebar p-3">
        <h5 class="mb-3">Menú</h5>
        <!-- más tarde mostraremos ítems según el rol -->
        <a th:href="@{/dashboard}">Dashboard</a>
        <a th:href="@{/modelos}">Modelos</a>
        <form th:action="@{/logout}" method="post" class="mt-3">
            <input type="hidden" th:if="${_csrf!=null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <button class="btn btn-sm btn-light">Salir</button>
        </form>
    </aside>

    <main class="flex-grow-1 p-4">
        <h3>Bienvenido</h3>
        <p>Has iniciado sesión correctamente.</p>
    </main>
</div>
</body>
</html>
