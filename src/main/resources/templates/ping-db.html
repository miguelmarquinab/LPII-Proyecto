<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title>Ping DB</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="p-4">
<div class="container">
    <h1 class="mb-3">Estado de la Base de Datos</h1>
    <div th:if="${status == 'UP'}" class="alert alert-success">
        DB está <strong>UP</strong>
    </div>
    <div th:if="${status != 'UP'}" class="alert alert-danger">
        DB está <strong>DOWN</strong>
    </div>
</div>
</body>
</html>
