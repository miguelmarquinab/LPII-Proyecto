<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Clientes</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>

	<div class="container">
		<h1>Lista de Clientes</h1>

		<a href="/cliente/nuevo" class="btn btn-sm btn-success"><i class="bi bi-person-plus"></i> Agregar</a>
		<table class="table table-striped table-hover table-sm" >
			<thead>
				<tr>
					<th>Código</th>
					<th>Razón social</th>
					<th>Tipo de documento</th>
					<th>Nro. de documento</th>
					<th>Dirección</th>
					<th>Teléfono</th>
					<th>Email</th>
					<th>Contacto</th>
					<th>Estado</th>
					<th></th>
				</tr>
			</thead>
			<tbody>
					<tr th:each="c: ${clientes}">
						<td th:text="${c.id}"> </td>
						<td th:text="${c.razonSocial}"></td>
						<td th:text="${c.tipoDocumento}"></td>
						<td th:text="${c.numeroDocumento}"></td>
						<td th:text="${c.direccion}"></td>
						<td th:text="${c.telefono}"></td>
						<td th:text="${c.email}"></td>
						<td th:text="${c.contacto}"></td>
						<td th:if="${c.activo}"><span class="badge text-bg-success">Activo</span></td>
						<td th:unless="${c.activo}"><span class="badge text-bg-danger">Inactivo</span></td>
						<td>
							
								<a class="btn btn-sm btn-outline-primary" th:href="@{/cliente/editar/{id}(id=${c.id})}" title="Editar"><i class="bi bi-pencil-fill"></i></a>
								
								<form th:action="@{'/cliente/eliminar/' + ${c.id}}" method="post" 
						              th:id="'formEliminar' + ${c.id}">
						            <button type="button" class="btn btn-sm btn-outline-danger"
						                    th:onclick="'confirmarEliminacion(' + ${c.id} + ')'"
						                    title="Eliminar">
						                <i class="bi bi-x-circle"></i>
						            </button>
						        </form>

						</td>
					</tr>

			</tbody>
		</table>

	</div>

	<form id="formEliminar" action="cliente?opcion=eliminar" method="post">
		<input type="hidden" name="id" />
	</form>
	
	<div class="modal fade" id="modalConfirmar" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header bg-danger text-white">
        <h5 class="modal-title">Confirmar eliminación</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        ¿Seguro que deseas eliminar este cliente?
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-danger" id="btnConfirmarEliminar">Eliminar</button>
      </div>
    </div>
  </div>
</div>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
	<script type="text/javascript">
	let idAEliminar = null;
	
	function confirmarEliminacion(id) {
		idAEliminar = id;
		const modal = new bootstrap.Modal(document.getElementById('modalConfirmar'));
		modal.show();
	}
	
	document.getElementById('btnConfirmarEliminar').addEventListener('click', function() {
		  if (idAEliminar !== null) {
			  document.getElementById("formEliminar" + idAEliminar).submit();
		  }
		});
	</script>
</body>
</html>
