<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title th:text="${titulo}">Modelo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="p-3">
<div class="container">
    <h3 th:text="${titulo}">Modelo</h3>

    <form th:object="${modelo}"
          th:action="${modelo.id} == null ? @{/modelos} : @{/modelos/{id}(id=${modelo.id})}"
          method="post" class="mt-3">

        <div class="mb-3">
            <label class="form-label" th:for="${#ids.prev('descripcion')}">Descripción</label>
            <input class="form-control" th:field="*{descripcion}"/>
            <small class="text-danger" th:if="${#fields.hasErrors('descripcion')}" th:errors="*{descripcion}"></small>
        </div>

        <div class="mb-3">
            <label class="form-label" th:for="${#ids.prev('codigo')}">Código</label>
            <input class="form-control" th:field="*{codigo}"/>
            <small class="text-danger" th:if="${#fields.hasErrors('codigo')}" th:errors="*{codigo}"></small>
        </div>

        <button class="btn btn-primary" type="submit">Guardar</button>
        <a class="btn btn-secondary" th:href="@{/modelos}">Volver</a>
    </form>
</div>
</body>
</html>
