<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8"/>
    <title>Modelos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="p-3">
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>Modelos</h3>
        <a class="btn btn-primary" th:href="@{/modelos/nuevo}">Nuevo</a>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

    <table class="table table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>Descripción</th>
            <th>Código</th>
            <th class="text-end">Acciones</th>
        </tr></thead>
        <tbody>
        <tr th:each="m : ${modelos}">
            <td th:text="${m.id}">1</td>
            <td th:text="${m.descripcion}">desc</td>
            <td th:text="${m.codigo}">cod</td>
            <td class="text-end">
                <a class="btn btn-sm btn-secondary" th:href="@{|/modelos/${m.id}/editar|}">Editar</a>
                <form th:action="@{|/modelos/${m.id}/eliminar|}" method="post" class="d-inline">
                    <button class="btn btn-sm btn-danger" onclick="return confirm('¿Eliminar?')">Eliminar</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
